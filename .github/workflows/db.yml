# データベースの検査（マイグレーションの適用と pgTAP テスト）。
# CI 用の使い捨てデータベースだけを使い、本番には一切接続しない（05 §7）。
name: DB

on:
  pull_request:
    paths:
      [
        'supabase/**',
        'scripts/local-db/**',
        'scripts/supabase-e2e/**',
        'scripts/check-db-types.mjs',
        'src/lib/database.types.ts',
        '.github/workflows/db.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'supabase/**',
        'scripts/local-db/**',
        'scripts/supabase-e2e/**',
        'scripts/check-db-types.mjs',
        'src/lib/database.types.ts',
        '.github/workflows/db.yml',
      ]

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 素の Postgres に Supabase の最小環境を再現して検査する（速い）
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Postgres と pgTAP を準備
        run: |
          PGV=$(ls /usr/lib/postgresql | sort -n | tail -1)
          sudo apt-get update -q
          sudo apt-get install -y -q "postgresql-${PGV}-pgtap" libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"
      - name: マイグレーションとテスト
        run: scripts/local-db/run.sh
        env:
          PGDATABASE: postgres
      # 手書きの型定義（src/lib/database.types.ts）が DB と一致しているか（N-9）。run.sh が作った検査用 DB を読む
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型定義と DB の一致
        run: node scripts/check-db-types.mjs
        env:
          DATABASE_URL: postgresql:///jobtrack_test

  # Supabase CLI のローカル DB（本物と同じイメージ）で検査する
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase db start
      # データベースの静的検査（設計書 03 §4.4）。警告が1件でもあれば失敗にする
      - run: supabase db lint --fail-on warning
      - run: supabase test db

  # 認証サービス・API込みの本物の Supabase で、アカウント完全削除を端から端まで確かめる（03 §8.1 S-22）
  supabase-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # 検証用ユーザーにパスワードでログインさせるため、この CI の中だけメールのログインを有効にする（本番の設定とは無関係）。
      # 招待判定フックは有効のまま（未招待のメールではユーザーを作れない）。
      - run: sed -i '/^\[auth.email\]/,/^\[/ s/^enable_signup = false/enable_signup = true/' supabase/config.toml
      - run: supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: scripts/supabase-e2e/account-deletion.sh
